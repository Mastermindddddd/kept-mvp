<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kept — promises, proof, priority</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('kept_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--surface-2:#F6F9F7;--ink:#0E1D19;--mute:#56675F;--faint:#8A9A93;--line:#DCE4E0;
  --brand:#0A6E5A;--brand-ink:#FFFFFF;--brand-soft:#DCEFE8;--warn:#A35407;--warn-soft:#FCEBD5;--bad:#B3261E;--bad-soft:#FBE2DF;
  --rail:#0E1D19;--rail-ink:#D6E6DF;--rail-mute:#7F968D;--rail-hi:rgb(255 255 255 / .08);--live:#46C9A5;
  --sh-1:0 0 0 1px rgb(14 29 25 / .06),0 1px 2px rgb(14 29 25 / .04),0 6px 16px -6px rgb(14 29 25 / .08);
  --sh-2:0 0 0 1px rgb(14 29 25 / .06),0 4px 8px -2px rgb(14 29 25 / .06),0 16px 32px -12px rgb(14 29 25 / .22);
  --ease:cubic-bezier(0.2,0,0,1);--r:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1411;--surface:#12201C;--surface-2:#172824;--ink:#E4EFEA;--mute:#9BB0A8;--faint:#6D827A;--line:#24372F;
  --brand:#46C9A5;--brand-ink:#062019;--brand-soft:#163A30;--warn:#E8AC4A;--warn-soft:#3A2B10;--bad:#F2A19A;--bad-soft:#3D1915;
  --rail:#070F0C;--sh-1:0 0 0 1px rgb(255 255 255 / .06),0 1px 2px rgb(0 0 0 / .4),0 8px 24px -10px rgb(0 0 0 / .5);
  --sh-2:0 0 0 1px rgb(255 255 255 / .08),0 4px 8px -2px rgb(0 0 0 / .4),0 18px 36px -12px rgb(0 0 0 / .6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1411;--surface:#12201C;--surface-2:#172824;--ink:#E4EFEA;--mute:#9BB0A8;--faint:#6D827A;--line:#24372F;
  --brand:#46C9A5;--brand-ink:#062019;--brand-soft:#163A30;--warn:#E8AC4A;--warn-soft:#3A2B10;--bad:#F2A19A;--bad-soft:#3D1915;
  --rail:#070F0C;--sh-1:0 0 0 1px rgb(255 255 255 / .06),0 1px 2px rgb(0 0 0 / .4),0 8px 24px -10px rgb(0 0 0 / .5);
  --sh-2:0 0 0 1px rgb(255 255 255 / .08),0 4px 8px -2px rgb(0 0 0 / .4),0 18px 36px -12px rgb(0 0 0 / .6);color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Familjen Grotesk',system-ui,sans-serif;margin:0;font-weight:600;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
p{margin:0 0 10px}p:last-child{margin-bottom:0}
.ic{width:18px;height:18px;flex:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- shell */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
nav{background:var(--rail);color:var(--rail-ink);padding:22px 14px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overscroll-behavior:contain}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px 18px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--live);color:#062019;display:grid;place-items:center;flex:none}
.logo .ic{width:20px;height:20px;stroke-width:2.25}
.brand b{font:700 22px/1 'Familjen Grotesk',system-ui}.brand small{display:block;font-size:11.5px;color:var(--rail-mute);margin-top:4px;letter-spacing:.02em}
nav .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-mute);padding:14px 12px 6px;font-weight:600}
nav a{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none;padding:9px 12px;border-radius:10px;font-weight:500;font-size:14.5px;opacity:.75;transition:background-color 150ms var(--ease),opacity 150ms var(--ease);-webkit-tap-highlight-color:transparent}
nav a[aria-current="page"]{background:var(--rail-hi);opacity:1;color:#fff}
nav a[aria-current="page"] .ic{color:var(--live)}
@media (hover:hover){nav a:hover{background:var(--rail-hi);opacity:1}}
.foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.ai-chip{display:flex;gap:9px;align-items:center;font-size:12.5px;line-height:1.35;padding:10px 12px;border-radius:10px;background:var(--rail-hi)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rail-mute);flex:none}.dot.on{background:var(--live);box-shadow:0 0 0 3px rgb(70 201 165 / .22)}
.theme{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--rail-hi)}
.theme button{flex:1;background:transparent;color:var(--rail-mute);border:0;padding:6px;border-radius:7px;display:grid;place-items:center;cursor:pointer;transition:background-color 150ms var(--ease),color 150ms var(--ease)}
.theme button[aria-pressed="true"]{background:rgb(255 255 255 / .12);color:var(--rail-ink)}
.theme .ic{width:16px;height:16px}
main{padding:32px clamp(16px,3vw,40px) 72px;width:100%;min-width:0;outline:none}

/* ---------- layout + surfaces */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:600;margin-bottom:6px}
.top h1{font-size:clamp(26px,3vw,32px)}.top p{margin:8px 0 0;color:var(--mute);max-width:680px;text-wrap:pretty}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr))}.g32{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
@media(max-width:1020px){.g32{grid-template-columns:1fr}}
.mt{margin-top:16px}.mt-s{margin-top:10px}
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--r);padding:20px;box-shadow:var(--sh-1);min-width:0}
.card h3{font-size:17px;display:flex;align-items:center;gap:8px}.card h3 .ic{color:var(--brand)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.kpi .lab{display:flex;align-items:center;gap:9px}
.ico{width:30px;height:30px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.ico .ic{width:16px;height:16px}
.k{font:600 34px/1.1 'Familjen Grotesk',system-ui;margin:14px 0 4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.k small{font-size:.5em;color:var(--mute);font-weight:500;letter-spacing:0}
.sub{color:var(--mute);font-size:13px}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--brand)}.delta.down{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--mute);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
td,th{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;margin:0 -10px;overscroll-behavior-x:contain}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand);white-space:nowrap;line-height:1.6}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--surface-2);color:var(--mute);box-shadow:inset 0 0 0 1px var(--line)}
.pill .ic{width:13px;height:13px}
.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.res{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);white-space:pre-wrap;text-wrap:pretty}
.note{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);padding:12px 14px;border-radius:12px;font-size:13.5px;margin:0 0 16px}
.note>.ic{color:var(--warn);margin-top:1px}.note.ok{background:var(--brand-soft)}.note.ok>.ic{color:var(--brand)}
.note.bad{background:var(--bad-soft)}.note.bad>.ic{color:var(--bad)}
.note .x{margin-left:auto;background:none;border:0;color:var(--mute);padding:2px;border-radius:6px;cursor:pointer;display:grid}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}.empty .ic{width:28px;height:28px;color:var(--brand);margin-bottom:8px}

/* ---------- controls */
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:var(--brand-ink);border:1px solid transparent;border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;position:relative;white-space:nowrap;transition:scale 150ms ease-out,background-color 150ms var(--ease),opacity 150ms var(--ease),color 150ms var(--ease)}
.btn:not(:disabled):active{scale:.96}
.btn.ghost{background:transparent;color:var(--brand);border-color:color-mix(in oklab,var(--brand) 38%,transparent)}
.btn.quiet{background:transparent;color:var(--mute);border-color:transparent}
@media (hover:hover){.btn:not(:disabled):hover{background:color-mix(in oklab,var(--brand) 86%,var(--ink))}
  .btn.ghost:not(:disabled):hover,.btn.quiet:not(:disabled):hover{background:var(--brand-soft);color:var(--brand)}}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{width:16px;height:16px}.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[aria-busy="true"]{color:transparent!important;cursor:progress}
.btn[aria-busy="true"]::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--brand-ink);border-right-color:transparent;animation:spin .7s linear infinite}
.btn.ghost[aria-busy="true"]::after,.btn.quiet[aria-busy="true"]::after{border-color:var(--brand);border-right-color:transparent}
input,select,textarea{font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;transition:border-color 150ms var(--ease),box-shadow 150ms var(--ease)}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in oklab,var(--brand) 22%,transparent)}
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}.row>.btn{flex:0 0 auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tg{display:flex;align-items:center;gap:12px;margin:12px 0 0;cursor:pointer;font-size:14px;color:var(--ink);font-weight:500}
.tg input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;padding:0;border:0;cursor:pointer;transition:background-color 150ms var(--ease)}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:translate 200ms var(--ease)}
.tg input:checked{background:var(--brand)}.tg input:checked::after{translate:16px 0}
.tg input:focus{box-shadow:0 0 0 3px color-mix(in oklab,var(--brand) 22%,transparent)}
.seg{display:inline-flex;background:var(--surface);padding:3px;border-radius:12px;box-shadow:var(--sh-1);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mute);display:inline-flex;gap:7px;align-items:center;cursor:pointer;transition:background-color 150ms var(--ease),color 150ms var(--ease)}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.seg .c{font-size:11.5px;padding:0 7px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--mute);cursor:pointer;transition:background-color 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease)}
@media (hover:hover){.chip:hover{border-color:var(--brand);color:var(--brand)}}
span.chip{cursor:default}
.drop{position:relative}.drop.drag textarea{border-color:var(--brand);border-style:dashed;background:var(--brand-soft)}

/* ---------- data viz */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--brand);border-radius:99px;transform-origin:left;transform:scaleX(var(--w,0));transition:transform 800ms var(--ease)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}.bar i.m{background:var(--faint)}
.pre .bar i{transform:scaleX(0)}
.hb{margin:12px 0}.hb-h{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:14px}
.hb-h b{font-weight:600;font-variant-numeric:tabular-nums}
.chart{position:relative}.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.chart .gl{stroke:var(--line)}.chart .ax{fill:var(--faint);font-size:11px;font-family:inherit}
.chart .line{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--brand);stroke-width:2}
.chart .tgt{stroke:var(--warn);stroke-dasharray:5 5;stroke-width:1.5}.chart .tgt-l{fill:var(--warn);font-size:11px;font-weight:600}
.chart .hov{stroke:var(--faint);stroke-width:1;opacity:0}.chart .hdot{fill:var(--brand);opacity:0;stroke:var(--surface);stroke-width:3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));opacity:0;transition:opacity 150ms var(--ease);z-index:2}
.tip.on{opacity:1}
.eta-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin:14px 0 18px}
.eta-top .k{margin:0}
.eta-area{position:relative;height:150px;display:flex;align-items:flex-end;gap:6px;border-bottom:1px solid var(--line)}
.eta-x{display:flex;gap:6px;margin-top:6px}.eta-x span{flex:1;text-align:center;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.eb{flex:1;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0;position:relative;cursor:pointer;border-radius:6px 6px 0 0}
.eb .col{display:block;width:100%;height:calc(var(--h) * 100%);border-radius:6px 6px 2px 2px;background:var(--line);transform-origin:bottom;transition:transform 700ms var(--ease),background-color 150ms var(--ease)}
.eb.ok .col{background:color-mix(in oklab,var(--brand) 40%,var(--surface))}.eb.rec .col{background:var(--brand)}
.pre .eb .col{transform:scaleY(0)}
.eb .tt{position:absolute;bottom:calc(var(--h) * 100% + 6px);left:50%;translate:-50% 0;background:var(--ink);color:var(--bg);font-size:11.5px;line-height:1.35;padding:5px 8px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 150ms var(--ease);z-index:2}
.eb.rec .tt{opacity:1;background:var(--brand);color:var(--brand-ink)}
.eb:nth-child(2) .tt,.eb:nth-child(3) .tt{left:0;translate:0 0}
.eb:nth-last-child(-n+3) .tt{left:auto;right:0;translate:0 0}
@media (hover:hover){.eb:hover .tt{opacity:1;z-index:3}.eb:hover .col{background:color-mix(in oklab,var(--brand) 70%,var(--surface))}}
.eb:focus-visible .tt{opacity:1;z-index:3}
.tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--warn);pointer-events:none;z-index:1}
.tline span{position:absolute;right:0;top:-19px;font-size:11px;font-weight:600;color:var(--warn);background:var(--surface);padding:0 4px}
.ring{width:150px;height:150px;flex:none}
.ring circle{fill:none;stroke-width:11}.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--brand);stroke-linecap:round;stroke-dasharray:var(--v) 100;rotate:-90deg;transform-origin:center;transition:stroke-dasharray 1100ms var(--ease)}
.pre .ring .val{stroke-dasharray:0 100}
.gauge{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.gauge .k{font-size:52px;margin:0}
.ci{position:relative;height:40px;margin:26px 4px 4px}
.ci::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.ci-range{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:99px;background:color-mix(in oklab,var(--brand) 32%,transparent)}
.ci-pt{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--surface)}
.ci-zero{position:absolute;top:2px;bottom:2px;border-left:1.5px dashed var(--mute)}
.ci-zero span{position:absolute;top:-20px;left:0;translate:-50% 0;font-size:11px;color:var(--mute);white-space:nowrap}
.ci-ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}

/* ---------- tickets, people, outcomes */
.tk{position:relative;background:var(--surface);border-radius:14px;padding:16px 18px 16px 22px;margin-bottom:10px;box-shadow:var(--sh-1);border:1px solid transparent;overflow:hidden}
.tk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.tk[data-s="overdue"]::before{background:var(--bad)}.tk[data-s="soon"]::before{background:var(--warn)}.tk[data-s="open"]::before{background:var(--brand)}
.tk-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.who{display:flex;gap:11px;align-items:center;min-width:0}.who b{display:block;line-height:1.25}.who .sub{display:block;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tk .msg{margin:12px 0 0;text-wrap:pretty}
.tk.out{animation:exit 150ms ease-out both}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none;letter-spacing:.02em}
.av.lg{width:56px;height:56px;font-size:19px}
.urg{display:inline-flex;gap:3px;align-items:center}.urg i{width:6px;height:12px;border-radius:2px;background:var(--line)}
.urg i.on{background:var(--warn)}.urg.u3 i.on{background:var(--bad)}
.meta-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.risk{display:flex;align-items:center;gap:10px;min-width:180px}.risk .bar{flex:1}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.act{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:14px}.act .ic{color:var(--brand);margin-top:2px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 6px;flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--mute);padding:6px 12px 6px 6px;border-radius:99px;background:var(--surface-2);transition:background-color 200ms var(--ease),color 200ms var(--ease)}
.steps li b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--mute);font-size:12px;transition:background-color 200ms var(--ease),color 200ms var(--ease)}
.steps li.on{background:var(--brand-soft);color:var(--brand)}.steps li.on b{background:var(--brand);color:var(--brand-ink)}
.steps li.done{color:var(--ink)}.steps li.done b{background:var(--brand-soft);color:var(--brand)}
.steps .ic{width:13px;height:13px;stroke-width:2.5}
.outs{display:grid;gap:10px;margin-top:14px}
.out{display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.out .oi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.out.kept .oi{background:var(--brand-soft);color:var(--brand)}.out.broken .oi{background:var(--bad-soft);color:var(--bad)}
.out .oi .ic{stroke-width:2.5}
.coin{margin-left:auto;display:flex;gap:6px;align-items:center;font:600 20px 'Familjen Grotesk',system-ui;color:var(--brand);font-variant-numeric:tabular-nums}
.pop>*{animation:enter 300ms ease-out both}.pop>*:nth-child(2){animation-delay:100ms}.pop>*:nth-child(3){animation-delay:200ms}
.chain{display:flex;overflow-x:auto;padding:6px 2px 12px;overscroll-behavior-x:contain}
.blk{flex:none;width:118px;padding:10px 11px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;position:relative;transition:border-color 200ms var(--ease),background-color 200ms var(--ease)}
.blk+.blk{margin-left:20px}
.blk+.blk::before{content:"";position:absolute;left:-21px;top:50%;width:20px;border-top:2px solid var(--line);transition:border-color 200ms var(--ease)}
.blk b{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.blk .ic{width:14px;height:14px;color:var(--brand);opacity:0;transition:opacity 200ms var(--ease)}
.blk .kd{color:var(--mute);margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .h{font:11px ui-monospace,Menlo,monospace;color:var(--faint)}
.blk.ok{border-color:color-mix(in oklab,var(--brand) 60%,transparent);background:var(--brand-soft)}.blk.ok .ic{opacity:1}
.blk.ok+.blk.ok::before{border-color:var(--brand)}
.swap{display:inline-grid}.swap>svg{grid-area:1/1;transition:opacity 300ms var(--ease),scale 300ms var(--ease),filter 300ms var(--ease)}
.swap .b{opacity:0;scale:.25;filter:blur(4px)}.on>.swap .a{opacity:0;scale:.25;filter:blur(4px)}.on>.swap .b{opacity:1;scale:1;filter:blur(0)}
.prog{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin:14px 0 6px}

/* ---------- toasts, skeletons, motion */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:50;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;box-shadow:var(--sh-2);font-size:14px;animation:enter 300ms ease-out both}
.toast .ic{color:var(--live);margin-top:1px}.toast.err .ic{color:#F2A19A}.toast.out{animation:exit 150ms ease-out both}
.sk{border-radius:var(--r);background:var(--surface);box-shadow:var(--sh-1);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--line) 70%,transparent),transparent);translate:-100% 0}
@keyframes spin{to{rotate:360deg}}
@keyframes enter{from{opacity:0}}
@keyframes exit{to{opacity:0}}
@keyframes fadein{from{opacity:0}}
@keyframes shim{to{translate:100% 0}}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:no-preference){
  @keyframes enter{from{opacity:0;filter:blur(4px);translate:0 12px}}
  @keyframes exit{to{opacity:0;filter:blur(4px);translate:0 -12px}}
  .sk::after{animation:shim 1.3s ease-in-out infinite}
}
@media (prefers-reduced-motion:reduce){
  .sk{animation:pulse 1.6s ease-in-out infinite}
  .btn[aria-busy="true"]::after{animation:pulse 1s ease-in-out infinite}
  .bar i,.eb .col,.ring .val,.btn,.tg input::after{transition-property:opacity,background-color,color}
  .swap>svg{scale:1!important;filter:none!important}
}
.stage [data-in]{animation:enter 300ms ease-out both;animation-delay:calc(min(var(--i,0),6) * 100ms)}
.fade{animation:fadein 150ms ease-out both}

@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.g4 .card{padding:16px}
  .kpi .lab{font-size:11px}.kpi .ico{display:none}
  nav{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;gap:2px;scrollbar-width:none;overscroll-behavior-x:contain}
  nav::-webkit-scrollbar{display:none}
  .brand{padding:0 8px 0 2px}.brand small,.brand b,nav .sec,.foot{display:none}
  nav a{flex:none;padding:8px 11px;font-size:14px}
  main{padding:22px 16px 72px}
  .k{font-size:30px}.gauge .k{font-size:44px}
}
</style>
</head>
<body>
<div class="app">
<nav id="nav" aria-label="Main">
  <div class="brand"><span class="logo" id="logo"></span><div><b>Kept</b><small>Promise · Proof · Priority</small></div></div>
  <div class="sec">Run the business</div>
  <a href="#overview" data-v="overview" data-i="grid">Overview</a>
  <a href="#promises" data-v="promises" data-i="shield">Promises</a>
  <a href="#desk" data-v="desk" data-i="inbox">Service desk</a>
  <a href="#radar" data-v="radar" data-i="activity">Risk radar</a>
  <div class="sec">Show the proof</div>
  <a href="#scorecard" data-v="scorecard" data-i="award">Public scorecard</a>
  <a href="#customer" data-v="customer" data-i="user">Customer view</a>
  <div class="sec">Set up</div>
  <a href="#data" data-v="data" data-i="database">Data &amp; AI</a>
  <div class="foot">
    <div class="ai-chip" id="aistat"><span class="dot"></span><span>Checking AI…</span></div>
    <div class="theme" role="group" aria-label="Theme">
      <button type="button" data-theme="system" aria-label="Match system theme" title="System"></button>
      <button type="button" data-theme="light" aria-label="Light theme" title="Light"></button>
      <button type="button" data-theme="dark" aria-label="Dark theme" title="Dark"></button>
    </div>
  </div>
</nav>
<main id="main" tabindex="-1"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R'+Number(n||0).toLocaleString('en-ZA',{maximumFractionDigits:0});
const pc=(x,d=0)=>x==null?'n/a':(x*100).toFixed(d)+'%';
const motionOK=()=>matchMedia('(prefers-reduced-motion: no-preference)').matches;
const ini=n=>esc(String(n||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase());
const ago=ts=>{const h=(Date.now()-new Date(ts+'Z'))/36e5;return h<1?Math.max(1,Math.round(h*60))+'m ago':h<48?Math.round(h)+'h ago':Math.round(h/24)+'d ago'};
const hrs=h=>Math.abs(h)<1?Math.round(Math.abs(h)*60)+' min':Math.abs(h).toFixed(1)+' h';

const I={
 grid:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 shield:'<path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
 inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.5-6.9A2 2 0 0016.8 4H7.2a2 2 0 00-1.7 1.1z"/>',
 activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
 award:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14.3L7 22l5-3 5 3-1.5-7.7"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
 database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
 monitor:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
 check:'<path d="M20 6L9 17l-5-5"/>',x:'<path d="M18 6L6 18M6 6l12 12"/>',
 sparkle:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M17 19h4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 alert:'<path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
 link:'<path d="M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"/>',
 upload:'<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 refresh:'<path d="M21 12a9 9 0 01-15.5 6.2L3 16M3 12a9 9 0 0115.5-6.2L21 8M21 3v5h-5M3 21v-5h5"/>',
 truck:'<path d="M1 4h14v12H1zM15 8h4l3 3v5h-7"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/>',
 coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v11"/>',
 send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
 copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 risk:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/>',lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>',
 k:'<path d="M7 4v16M7 13l9-9M10.5 10.5L17 20"/>'
};
const icon=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||''}</svg>`;

let TOKEN='';try{TOKEN=localStorage.getItem('kept_token')||''}catch(e){}
async function api(path,body){
  const o={headers:{'Content-Type':'application/json'}};
  if(TOKEN)o.headers['X-Kept-Token']=TOKEN;
  if(body!==undefined){o.method='POST';o.body=JSON.stringify(body)}
  const r=await fetch('/api'+path,o);
  if(r.status===401){TOKEN=prompt('This server needs an access token:')||'';try{localStorage.setItem('kept_token',TOKEN)}catch(e){}if(!TOKEN)throw new Error('access token required');return api(path,body)}
  const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j
}
function toast(m,kind='ok'){
  const box=$('#toasts'),t=document.createElement('div');
  t.className='toast'+(kind==='err'?' err':'');if(kind==='err')t.setAttribute('role','alert');
  t.innerHTML=icon(kind==='err'?'alert':'check')+'<div>'+esc(m)+'</div>';box.append(t);
  while(box.children.length>3)box.firstElementChild.remove();
  setTimeout(()=>{t.classList.add('out');t.addEventListener('animationend',()=>t.remove(),{once:true})},kind==='err'?6000:4200)
}
const busy=async(btn,fn)=>{btn.disabled=true;btn.setAttribute('aria-busy','true');try{await fn()}catch(e){toast(e.message,'err')}finally{btn.disabled='lock' in btn.dataset;btn.removeAttribute('aria-busy')}};  // data-lock keeps a finished step disabled
const src=r=>r.source==='claude'?`<span class="pill">${icon('sparkle')}written by Claude</span>`:(r.source==='ollama'||r.source==='openai')?`<span class="pill">${icon('sparkle')}written by ${esc(r.model||r.source)} (${r.source==='ollama'?'local model':'hosted model'})</span>`:`<span class="pill mute" title="${esc(r.note)}">rule-based fallback</span>`;
const copyBtn=(text,label='Copy')=>`<button type="button" class="btn quiet sm" data-copy="${esc(text)}"><span class="swap">${icon('copy','a')}${icon('check','b')}</span><span>${label}</span></button>`;

/* --- staged entrance helpers. Each view numbers its chunks; the first visit staggers them, later visits just fade. */
function stagger(){let n=0;return()=>`data-in style="--i:${n++}"`}
const head=(S,eye,t,p,side='')=>`<header class="top" ${S()}><div><div class="eyebrow">${eye}</div><h1>${t}</h1><p>${p}</p></div>${side}</header>`;
const FMT={pct:v=>pc(v),pct1:v=>pc(v,1),R:v=>R(v),int:v=>Math.round(v).toLocaleString()};
function countAll(root,animate){
  $$('[data-count]',root).forEach(el=>{
    const to=parseFloat(el.dataset.count),f=FMT[el.dataset.fmt||'int'];
    if(!animate||!isFinite(to)){el.textContent=f(to);return}
    const t0=performance.now(),dur=900;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=f(to*e);if(k<1)requestAnimationFrame(step)};
    el.textContent=f(0);requestAnimationFrame(step)
  })
}
function drawLines(root){
  $$('path.line',root).forEach(p=>{
    const len=p.getTotalLength();p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.getBoundingClientRect();
    p.style.transition='stroke-dashoffset 1100ms cubic-bezier(0.2,0,0,1)';p.style.strokeDashoffset=0;
    p.addEventListener('transitionend',()=>{p.style.strokeDasharray='';p.style.strokeDashoffset='';p.style.transition=''},{once:true})
  })
}
function animateIn(el){
  if(!motionOK()){el.classList.add('fade');countAll(el,false);return}
  el.classList.add('stage','pre');countAll(el,true);drawLines(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.remove('pre')));
  setTimeout(()=>el.classList.remove('stage'),1500)
}
const cnt=(v,fmt,shown)=>`<span data-count="${v==null?'':v}" data-fmt="${fmt}">${shown}</span>`;
const hbar=(label,v,cls='',right)=>`<div class="hb"><div class="hb-h"><span>${label}</span><b>${right??pc(v)}</b></div><div class="bar"><i class="${cls}" style="--w:${Math.max(0,Math.min(1,v||0))}"></i></div></div>`;
const rateCls=v=>v<.5?'b':v<.8?'w':'';

/* --- line chart with hover read-out */
function lineChart(pts,{target,fmt=v=>pc(v,1),label='Kept rate by week'}){
  const W=640,H=210,pl=40,pr=14,pt=16,pb=28,ys=pts.map(p=>p.y).filter(v=>v!=null);
  if(ys.length<2)return{html:'<div class="empty">Not enough weeks of history yet.</div>',wire(){}};
  const lo=Math.max(0,Math.floor((Math.min(target??1,...ys)-.05)*10)/10),hi=1;
  const x=i=>pl+i*(W-pl-pr)/(pts.length-1),y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  const live=pts.map((p,i)=>[i,p.y]).filter(p=>p[1]!=null);
  const d=live.map(([i,v],k)=>(k?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=`${d} L${x(live.at(-1)[0]).toFixed(1)} ${H-pb} L${x(live[0][0]).toFixed(1)} ${H-pb} Z`;
  const ticks=[lo,(lo+hi)/2,hi];
  const gid='g'+Math.random().toString(36).slice(2,8);
  const html=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--brand);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--brand);stop-opacity:0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${pl-8}" y="${y(t)+4}" text-anchor="end">${pc(t)}</text>`).join('')}
    ${pts.map((p,i)=>i%2===pts.length%2?'':`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>`).join('')}
    ${target!=null?`<line class="tgt" x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}"/><text class="tgt-l" x="${W-pr}" y="${y(target)-6}" text-anchor="end">target ${pc(target)}</text>`:''}
    <path d="${area}" fill="url(#${gid})"/><path class="line" d="${d}"/>
    ${live.map(([i,v])=>`<circle class="pt" cx="${x(i)}" cy="${y(v)}" r="3.5"/>`).join('')}
    <line class="hov" y1="${pt}" y2="${H-pb}"/><circle class="hdot" r="5.5"/>
  </svg><div class="tip"></div></div>`;
  return{html,wire(root){
    const svg=$('svg',root),tip=$('.tip',root),hov=$('.hov',root),dot=$('.hdot',root);
    const hide=()=>{tip.classList.remove('on');hov.style.opacity=0;dot.style.opacity=0};
    svg.addEventListener('pointermove',e=>{
      const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*W;
      const i=Math.max(0,Math.min(pts.length-1,Math.round((sx-pl)/((W-pl-pr)/(pts.length-1))))),p=pts[i];
      if(p.y==null)return hide();
      hov.setAttribute('x1',x(i));hov.setAttribute('x2',x(i));hov.style.opacity=1;
      dot.setAttribute('cx',x(i));dot.setAttribute('cy',y(p.y));dot.style.opacity=1;
      tip.style.left=(x(i)/W*100)+'%';tip.style.top=(y(p.y)/H*100)+'%';
      tip.innerHTML=`<b>${fmt(p.y)}</b> · week of ${esc(p.label)}${p.extra?'<br>'+p.extra:''}`;tip.classList.add('on')});
    svg.addEventListener('pointerleave',hide)
  }}
}
const wkLabel=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-ZA',{day:'numeric',month:'short',timeZone:'UTC'});

let synthHidden=false;try{synthHidden=localStorage.getItem('kept_synth')==='hide'}catch(e){}
const synth=S=>synthHidden?'':`<div class="note" id="synth" ${S()}>${icon('alert')}<div><b>Demo data is synthetic.</b> 700 invented customers, simulated over 12 months, replayed through the real rules engine. The effect of friction on lapsing is built into the generator, so these numbers show the system working, not proof it raises retention. Import your own CSV under Data &amp; AI.</div><button class="x" type="button" data-dismiss aria-label="Hide this note">${icon('x')}</button></div>`;

const V={};

/* ================================================================ overview */
V.overview=async el=>{
  const s=await api('/summary');if(!el.isConnected)return;
  const S=stagger(),sc=s.scorecard,rt=s.retention,k=rt.groups.kept,h=rt.groups.holdout,d=rt.difference_discount_free,op=s.operations;
  const reg=Object.entries(s.regions).sort((a,b)=>a[1].kept_rate-b[1].kept_rate);
  const agg=a=>{const kk=a.reduce((t,b)=>t+b.kept,0),n=a.reduce((t,b)=>t+b.kept+b.broken,0);return n?kk/n:null};
  const last=agg(s.trend.slice(-4)),prev=agg(s.trend.slice(-8,-4)),dl=last!=null&&prev!=null?last-prev:null;
  const ch=lineChart(s.trend.map(w=>({y:w.kept_rate,label:wkLabel(w.week_start),extra:`${w.kept+w.broken} judged · ${R(w.credits)} credits`})),{target:s.target});
  const ciLo=Math.min(-.1,d?d.low:0)-.05,ciHi=Math.max(.1,d?d.high:0)+.05,P=v=>((v-ciLo)/(ciHi-ciLo)*100).toFixed(2)+'%';
  const kpi=(ic,lab,val,subtxt)=>`<div class="card kpi" ${S()}><div class="lab"><span class="ico">${icon(ic)}</span>${lab}</div><div class="k">${val}</div><div class="sub">${subtxt}</div></div>`;
  el.innerHTML=head(S,'Overview','Promises, proof and loyalty','What the business promised, what it kept, and what that does to loyalty. Every number is computed live from the ledger and the order data.')+synth(S)+`
  <div class="grid g4">
   ${kpi('shield','Promises kept · 90d',cnt(sc.overall_kept_rate,'pct',pc(sc.overall_kept_rate)),`${sc.judged.toLocaleString()} judged ${dl!=null?`· <span class="delta ${dl<0?'down':''}">${dl<0?'▼':'▲'} ${Math.abs(dl*100).toFixed(1)} pts</span> vs prior 4 wks`:''}`)}
   ${kpi('user','Discount-free retention',cnt(k.discount_free_retention,'pct',pc(k.discount_free_retention)),`Kept n=${k.n} vs <b>${pc(h.discount_free_retention)}</b> holdout n=${h.n}`)}
   ${kpi('coin','Credits paid · 90d',cnt(sc.credits_paid,'R',R(sc.credits_paid)),`${sc.credit_events_capped} stopped by the per-customer cap`)}
   ${kpi('risk','Revenue at risk',cnt(s.radar.total_value_at_risk,'R',R(s.radar.total_value_at_risk)),`${s.radar.scored} customers scored · <a href="#radar">see radar</a>`)}
  </div>
  <div class="grid g32 mt">
   <div class="card" ${S()}><div class="card-h"><h3>${icon('activity')}Promise record, week by week</h3><span class="sub">holdout excluded · hover for detail</span></div><div id="trend">${ch.html}</div></div>
   <div class="card" ${S()}><div class="card-h"><h3>${icon('truck')}Delivery kept by region</h3></div>
    ${reg.map(([r,v])=>hbar(esc(r),v.kept_rate,rateCls(v.kept_rate),`${pc(v.kept_rate)} <span class="sub">of ${v.kept+v.broken}</span>`)).join('')||'<p class="sub">No deliveries judged yet.</p>'}
    <p class="sub mt-s">A flat 3-day promise is kept in the metros and broken in far regions. <a href="#promises">Quote honest windows</a>.</p></div>
  </div>
  <div class="grid g2 mt">
   <div class="card" ${S()}><div class="card-h"><h3>${icon('k')}Does Kept protect loyalty?</h3>${rt.small_sample?'<span class="pill warn">small holdout</span>':''}</div>
    ${hbar('Kept group',k.discount_free_retention,'',`${pc(k.discount_free_retention,1)} <span class="sub">n=${k.n}</span>`)}
    ${hbar('Holdout (no Kept)',h.discount_free_retention,'m',`${pc(h.discount_free_retention,1)} <span class="sub">n=${h.n}</span>`)}
    ${d?`<div class="ci" role="img" aria-label="Difference ${(d.diff*100).toFixed(1)} points, 95% interval ${(d.low*100).toFixed(1)} to ${(d.high*100).toFixed(1)}"><div class="ci-zero" style="left:${P(0)}"><span>no effect</span></div><div class="ci-range" style="left:${P(d.low)};width:calc(${P(d.high)} - ${P(d.low)})"></div><div class="ci-pt" style="left:${P(d.diff)}"></div></div>
    <div class="ci-ax"><span>${(d.low*100).toFixed(1)} pts</span><b>${d.diff>=0?'+':''}${(d.diff*100).toFixed(1)} pts</b><span>${(d.high*100).toFixed(1)} pts</span></div>`:'<p class="sub">Not enough customers in both groups yet.</p>'}
    <p class="sub mt">95% interval (${esc(d?.method||'n/a')}). Retained only through coupons: kept ${k.coupon_bought}, holdout ${h.coupon_bought}. ${rt.small_sample?'<b>The holdout is small, so read this as a direction, not a result.</b> ':''}A real pilot needs a larger holdout and 12 months.</p></div>
   <div class="card" ${S()}><div class="card-h"><h3>${icon('coin')}Is it worth the credits?</h3><span class="pill ${op.decision_rule_passes?'':'warn'}">${op.decision_rule_passes?icon('check')+'passes the rule':'does not pass'}</span></div>
    ${hbar('Credits paid · 90d',op.credits_cost_90d/Math.max(op.credits_cost_90d,op.gross_margin_on_followup_orders,1),'w',R(op.credits_cost_90d))}
    ${hbar('Gross margin on later orders',op.gross_margin_on_followup_orders/Math.max(op.credits_cost_90d,op.gross_margin_on_followup_orders,1),'',R(op.gross_margin_on_followup_orders))}
    <p class="sub mt">${esc(op.decision_rule_note)}</p>
    <div class="chips mt-s"><span class="chip">Repeat contact ${pc(op.repeat_contact_rate)}</span><span class="chip">Avg first reply ${op.avg_first_reply_hours??'n/a'} h</span><span class="chip">${op.credited_customers} credited customers</span></div></div>
  </div>

   <div id="ans" aria-live="polite"></div></div>`;

  $('#askf').onsubmit=e=>{e.preventDefault();ask()};
  $$('[data-q]',el).forEach(b=>b.onclick=()=>{$('#q').value=b.dataset.q;ask()})
};

/* ================================================================ promises */
V.promises=async el=>{
  const p=await api('/promises');if(!el.isConnected)return;
  const S=stagger(),c=p.config;
  const num=(id,lab,v,step=1)=>`<div><label for="${id}">${lab}</label><input id="${id}" type="number" step="${step}" value="${v}"></div>`;
  el.innerHTML=head(S,'Promise','Promises the business will keep','Each rule change is written to the ledger. Credits are paid automatically when a promise breaks, and capped per customer.')+`
  <div class="grid g2">
   <div class="card" ${S()}><div class="card-h"><h3>${icon('shield')}Rules</h3><span class="sub">changes are logged on the ledger</span></div>
    <form id="rules">
    <label class="tg"><input type="checkbox" id="e1" ${c.delivery.enabled?'checked':''}>Delivery promise</label>
    <div class="row">${num('c1','Credit (% of order)',c.delivery.credit_pct)}${num('c2','Max per late order (R)',c.delivery.max_credit)}</div>
    <label class="tg"><input type="checkbox" id="e3" ${c.reply.enabled?'checked':''}>Reply promise</label>
    <div class="row">${num('c3','Reply within (hours)',c.reply.hours,0.5)}${num('c4','Late-reply credit (R)',c.reply.credit)}</div>
    <label class="tg"><input type="checkbox" id="e2" ${c.price.enabled?'checked':''}>All-in price promise <span class="sub">(any surprise charge refunded in full)</span></label>
    <div class="row mt-s">${num('c5','Cap per customer / 90 days (R)',c.caps.per_customer_90d)}${num('c6','Gross margin %',c.margin_pct)}${num('c7','Target kept rate %',Math.round(c.target_kept_rate*1000)/10,0.5)}</div>
    <div class="actions"><button class="btn" id="save">${icon('link')}Save rules to ledger</button></div></form></div>
   <div class="card" ${S()}><div class="card-h"><h3>${icon('truck')}Honest delivery window</h3>
    <select id="reg" aria-label="Region" style="width:auto">${p.regions.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>
    <p class="sub">Quoted from this business's own delivery history, so the promise can be kept. Recent deliveries count more.</p>
    <div id="eta"><div class="sk" style="height:220px;margin-top:14px"></div></div></div>
  </div>
  <div class="card mt" ${S()}><div class="card-h"><h3>${icon('sparkle')}Try it live: place an order, then deliver it late</h3><span class="sub">runs through the real engine and ledger</span></div>
   <ol class="steps" id="steps"><li class="on"><b>1</b>Place order</li><li><b>2</b>Deliver</li><li><b>3</b>See the outcome</li></ol>
   <div class="grid g2 mt-s">
    <form id="f1"><div class="row"><div><label for="o_c">Customer id</label><input id="o_c" value="C1001"></div><div><label for="o_t">Order total (R)</label><input id="o_t" type="number" value="900"></div></div>
     <div class="row"><div><label for="o_d">Promised days</label><input id="o_d" type="number" step="0.5" placeholder="auto: honest window"></div><button class="btn" id="o_go">Place order</button></div></form>
    <form id="f2"><div class="row"><div><label for="d_o">Order id</label><input id="d_o" placeholder="from step 1"></div><div><label for="d_days">Days it actually took</label><input id="d_days" type="number" step="0.5" value="6"></div></div>
     <div class="row"><div><label for="d_f">Final total charged (R)</label><input id="d_f" type="number" placeholder="same as quote"></div><button class="btn" id="d_go" disabled data-lock>${icon('truck')}Deliver</button></div></form>
   </div>
   <div id="o_res" aria-live="polite"></div></div>`;
  const setStep=n=>$$('#steps li',el).forEach((li,i)=>{li.className=i<n-1?'done':i===n-1?'on':'';li.firstElementChild.innerHTML=i<n-1?icon('check'):String(i+1)});
  $('#rules').onsubmit=e=>{e.preventDefault();busy($('#save'),async()=>{
    await api('/promises',{delivery:{enabled:$('#e1').checked,credit_pct:$('#c1').value,max_credit:$('#c2').value},price:{enabled:$('#e2').checked},reply:{enabled:$('#e3').checked,hours:$('#c3').value,credit:$('#c4').value},caps:{per_customer_90d:$('#c5').value},margin_pct:$('#c6').value,target_kept_rate:$('#c7').value/100});
    toast('Rules saved and logged on the ledger');loadEta()})};
  const loadEta=async()=>{
    const q=await api('/eta?region='+encodeURIComponent($('#reg').value));if(!el.isConnected)return;
    if(!q.n){$('#eta').innerHTML=`<div class="empty">${icon('truck')}<div>No delivery history for this region yet.</div></div>`;return}
    const show=q.table.filter(t=>t.promise_days<=Math.max(7,q.recommended_days+2));
    $('#eta').innerHTML=`<div class="eta-top"><div><div class="k">${q.recommended_days} <small>days</small></div><div class="sub">smallest promise kept ${pc(q.target)} of the time</div></div>
      <div class="chips"><span class="chip">typical ${q.p50} d</span><span class="chip">80% within ${q.p80} d</span><span class="chip">95% within ${q.p95} d</span></div></div>
     <div class="eta-area"><div class="tline" style="bottom:${q.target*100}%"><span>${pc(q.target)} target</span></div>
      ${show.map(t=>`<button type="button" class="eb ${t.promise_days===q.recommended_days?'rec':''} ${t.kept_rate>=q.target?'ok':''}" data-d="${t.promise_days}" style="--h:${t.kept_rate}" aria-label="Promise ${t.promise_days} days: kept ${pc(t.kept_rate)}, expected credit ${R(t.expected_credit_per_order)} per order"><span class="col"></span><span class="tt">${pc(t.kept_rate)} kept · ${R(t.expected_credit_per_order)}/order</span></button>`).join('')}</div>
     <div class="eta-x">${show.map(t=>`<span>${t.promise_days}d</span>`).join('')}</div>
     <p class="sub mt">Based on ${q.n} deliveries (effective ${q.n_effective} after weighting recent ones more). ${q.borrowed_from_all_regions?'Blended with all regions because history here is thin. ':''}${!q.target_reachable?'<b>No window up to 14 days reaches the target.</b> ':''}${q.target_reachable&&!q.confident?'<b>Low confidence: too few deliveries to be sure.</b> ':''}Tap a bar to use it below.</p>`;
    $$('.eb',el).forEach(b=>b.onclick=()=>{$('#o_d').value=b.dataset.d;toast(`Promise set to ${b.dataset.d} days for the live demo`)})
  };
  $('#reg').onchange=loadEta;await loadEta();
  let placedCustomer=null;
  $('#f1').onsubmit=e=>{e.preventDefault();busy($('#o_go'),async()=>{
    const r=await api('/orders',{customer_id:$('#o_c').value.trim(),quoted_total:$('#o_t').value,promised_days:$('#o_d').value||null});
    placedCustomer=$('#o_c').value.trim();$('#d_o').value=r.order_id;delete $('#d_go').dataset.lock;$('#d_go').disabled=false;setStep(2);
    $('#o_res').innerHTML=`<div class="pop"><div class="out kept"><div class="oi">${icon('check')}</div><div><b>Order ${esc(r.order_id)} placed</b><div class="sub">Promised within ${r.promised_days} days${$('#o_d').value?'':' (the honest window for this region)'}.</div></div></div></div>`})};
  $('#f2').onsubmit=e=>{e.preventDefault();busy($('#d_go'),async()=>{
    const oid=$('#d_o').value.trim();if(!oid)throw new Error('place an order first');
    const r=await api('/orders/'+encodeURIComponent(oid)+'/deliver',{final_total:$('#d_f').value||null,after_days:$('#d_days').value});
    setStep(4);$('#d_go').dataset.lock='';
    const box=$('#o_res');
    box.innerHTML=r.outcomes.length?`<div class="outs pop">${r.outcomes.map(x=>`<div class="out ${x.kept?'kept':'broken'}"><div class="oi">${icon(x.kept?'check':'x')}</div><div><b>${esc(x.promise)} promise ${x.kept?'kept':'broken'}</b><div class="sub">${x.credit?'Credit paid automatically, nobody had to ask':x.kept?'No credit needed':'No credit: holdout customer or cap reached'}</div></div>${x.credit?`<div class="coin">${icon('coin')}${cnt(x.credit,'R',R(x.credit))}</div>`:''}</div>`).join('')}</div><p class="sub mt-s">${icon('link')} Written to the ledger. <a href="#customer" data-open="${esc(placedCustomer||'')}">Open this customer</a></p>`:'<div class="res">Already judged.</div>';
    countAll(box,motionOK())})};
  el.addEventListener('click',e=>{const a=e.target.closest('[data-open]');if(a)try{sessionStorage.setItem('kept_cust',a.dataset.open)}catch(_){}})
};

/* ================================================================ service desk */
let deskFilter='all';
V.desk=async el=>{
  const t=(await api('/tickets')).tickets;if(!el.isConnected)return;
  const S=stagger();
  const state=x=>x.replied?'replied':x.overdue?'overdue':x.hours_left!=null&&x.hours_left<1.5?'soon':'open';
  const counts={all:t.length,overdue:0,soon:0,open:0,replied:0};t.forEach(x=>counts[state(x)]++);
  const shown=t.filter(x=>deskFilter==='all'||state(x)===deskFilter||(deskFilter==='open'&&state(x)==='soon'));
  const when=x=>x.replied?`<span class="pill mute">${icon('check')}replied</span>`:x.overdue?`<span class="pill bad">${icon('clock')}overdue by ${hrs(x.hours_left)}</span>`:`<span class="pill ${x.hours_left<1.5?'warn':''}">${icon('clock')}${hrs(x.hours_left)} left</span>`;
  const urg=u=>u?`<span class="urg u${u}" title="urgency ${u} of 3" aria-label="urgency ${u} of 3">${[1,2,3].map(i=>`<i class="${i<=u?'on':''}"></i>`).join('')}</span>`:'';
  const card=x=>`<article class="tk" data-s="${state(x)}" id="t${x.id}" ${S()}>
   <div class="tk-h"><div class="who"><span class="av">${ini(x.name)}</span><div><b>${esc(x.name)}</b><span class="sub">${esc(x.customer_id)} · ${ago(x.created_at)}${x.order_id?' · order '+esc(x.order_id):''}</span></div></div>
    <div class="tags"><span class="pill ${x.tier==='Priority'?'':'mute'}">${x.tier}</span>${when(x)}</div></div>
   <p class="msg">${esc(x.text)}</p>
   <div class="meta-row">${x.category?`<span class="pill mute">${esc(x.category.replace('_',' '))}</span>`:''}${urg(x.urgency)}${x.root_cause?`<span class="sub">Root cause: ${esc(x.root_cause)}</span>`:''}</div>
   ${x.suggested_reply?`<div class="res">${esc(x.suggested_reply)}</div><div class="meta-row">${src({source:x.triage_source,note:''})}${copyBtn(x.suggested_reply,'Copy reply')}</div>`:''}
   <div class="actions"><button class="btn sm" data-a="reply" data-id="${x.id}" ${x.replied?'disabled':''}>${icon('send')}Mark replied</button><button class="btn ghost sm" data-a="triage" data-id="${x.id}">${icon('sparkle')}Re-triage</button><button class="btn quiet sm" data-a="resolve" data-id="${x.id}">${icon('check')}Resolve</button></div></article>`;
  const segs=[['all','All'],['overdue','Overdue'],['open','Waiting'],['replied','Replied']];
  el.innerHTML=head(S,'Priority','Service desk','Overdue and unanswered tickets first, then the earned service tier (faster, more personal service; everyone keeps the same promises), then urgency.')+`
  <div class="grid g2">
   <div class="card" ${S()}><div class="card-h"><h3>${icon('inbox')}New ticket</h3><span class="sub">triaged as soon as it lands</span></div>
    <form id="nf"><label for="n_c">Customer id</label><input id="n_c" value="C1001"><label for="n_t">Message</label><textarea id="n_t" rows="4">I was told 3 days and it's day 6. Nobody replied to my first message. Where is my order?</textarea>
    <div class="actions"><button class="btn" id="n_go">${icon('sparkle')}Create and triage</button></div></form></div>
   <div class="card" ${S()}><div class="card-h"><h3>${icon('lock')}How triage is protected</h3></div>
    ${['Personal details are redacted before text leaves the server.','The ticket is passed as untrusted data, so instructions inside it are ignored.','Categories come from a fixed list; links and invented amounts are rejected.','The AI never issues credits. Only the rules engine moves money.','If a check fails, rule-based triage answers and says so.'].map(x=>`<div class="act">${icon('check')}<span>${x}</span></div>`).join('')}</div>
  </div>
  <div class="top mt" style="margin-bottom:12px;align-items:center" ${S()}><h3 style="font-size:20px">Open queue</h3>
   <div class="seg" role="group" aria-label="Filter tickets">${segs.map(([k,l])=>`<button type="button" data-f="${k}" aria-pressed="${deskFilter===k}">${l}<span class="c">${k==='open'?counts.open+counts.soon:counts[k]}</span></button>`).join('')}</div></div>
  <div id="queue">${shown.map(card).join('')||`<div class="card empty">${icon('check')}<div>Nothing here. Every customer in this view has an answer.</div></div>`}</div>`;
  $$('[data-f]',el).forEach(b=>b.onclick=()=>{deskFilter=b.dataset.f;V.desk(el)});
  $('#nf').onsubmit=e=>{e.preventDefault();busy($('#n_go'),async()=>{const r=await api('/tickets',{customer_id:$('#n_c').value.trim(),text:$('#n_t').value});toast(`Ticket triaged as ${r.category.replace('_',' ')} (${r.source==='fallback'?'rule-based':'AI'})`);deskFilter='all';await V.desk(el);const n=$('#t'+r.ticket_id);if(n)n.scrollIntoView({behavior:motionOK()?'smooth':'auto',block:'center'})})};
  $$('[data-a]',el).forEach(b=>b.onclick=()=>busy(b,async()=>{
    const id=b.dataset.id,a=b.dataset.a,r=await api(`/tickets/${id}/${a}`,{});
    if(a==='reply'&&r.outcomes.length)toast(r.outcomes.map(o=>`Reply promise ${o.kept?'kept':'broken'}${o.credit?`, ${R(o.credit)} credit issued`:''}`).join(', '));
    if(a==='triage')toast('Re-triaged');
    if(a==='resolve'){toast('Resolved');const c=$('#t'+id);c.classList.add('out');await new Promise(res=>c.addEventListener('animationend',res,{once:true}))}
    await V.desk(el)}))
};

/* ================================================================ risk radar */
V.radar=async el=>{
  const r=await api('/radar?limit=25');if(!el.isConnected)return;
  const S=stagger(),m=r.model;
  if(!m){el.innerHTML=head(S,'Risk','Risk radar','No model trained yet.')+`<div class="card empty" ${S()}>${icon('risk')}<div>Import some history, then train.</div><div class="actions" style="justify-content:center"><button class="btn" id="rt">${icon('refresh')}Train on current data</button></div></div>`;
    $('#rt').onclick=e=>busy(e.currentTarget,async()=>{await api('/model/retrain',{});V.radar(el)});return}
  const a=m.test_active,al=m.test_all,au=v=>Math.max(0,(v-.5)/.5);
  const cmp=(name,g)=>g.auc_model?`<div><div class="lab" style="margin-bottom:4px">${name} <span class="sub" style="text-transform:none;letter-spacing:0">n=${g.n}</span></div>
    ${hbar('Friction model',au(g.auc_model),'',`AUC ${g.auc_model}`)}${hbar('Recency only',au(g.auc_recency_only),'m',`AUC ${g.auc_recency_only}`)}
    <p class="sub">Top 20% lift: model ${g.lift_model.lift}× · recency ${g.lift_recency_only.lift}×</p></div>`:`<div class="sub">${name}: ${esc(g.note||'n/a')}</div>`;
  const riskCls=v=>v>.7?'b':v>.45?'w':'';
  el.innerHTML=head(S,'Risk','Risk radar','Customers ranked by revenue at risk, with the signals behind each score and the next action. A person decides; customers never see a score.',`<button class="btn ghost" id="rt">${icon('refresh')}Retrain</button>`)+synth(S)+`
  <div class="card" ${S()}><div class="card-h"><h3>${icon('k')}How good is the model, honestly?</h3><span class="sub">${esc(m.solver||'')} · 5-fold cross-validation · trained ${esc((m.trained_at||'').slice(0,10))}</span></div>
   <p class="sub">Does friction predict who stops buying better than "how long since they last bought"? Every customer is scored by a model that never saw them. AUC shown on a 0.5 (coin flip) to 1.0 scale.</p>
   <div class="grid g2 mt-s">${cmp('All customers',al)}${cmp('Still looked healthy (bought in last 60 days)',a)}</div>
   <div class="note mt">${icon('alert')}<div>${a.auc_model&&a.auc_model-a.auc_recency_only<0.03?'<b>On this data, friction signals add little over recency.</b> That is a real finding, not a bug: once credits repair friction, old friction no longer predicts leaving. The radar\'s value here is the reasons and the next action. A pilot would test this on real churn. ':''}${esc(m.note)}</div></div></div>
  <div class="top mt" style="margin-bottom:12px" ${S()}><h3 style="font-size:20px">Top ${r.customers.length} by revenue at risk</h3><span class="sub">${r.scored} customers scored · ${R(r.total_value_at_risk)} total at risk</span></div>
  ${r.customers.map(c=>`<article class="tk" data-s="${c.risk>.7?'overdue':c.risk>.45?'soon':'open'}" ${S()}>
   <div class="tk-h"><div class="who"><span class="av">${ini(c.name)}</span><div><b>${esc(c.name)}</b><span class="sub">${esc(c.customer_id)} · ${c.tier} · last order ${c.days_since_order}d ago</span></div></div>
    <div class="tags"><div class="risk"><div class="bar" style="width:110px"><i class="${riskCls(c.risk)}" style="--w:${c.risk}"></i></div><b>${pc(c.risk)}</b></div><span class="pill mute">${R(c.value_at_risk)} at risk</span></div></div>
   <div class="reasons">${c.reasons.map(x=>`<span class="chip">${esc(x.text)}</span>`).join('')||'<span class="sub">No friction signals</span>'}</div>
   <div class="act">${icon('arrow')}<span><b>Next action:</b> ${esc(c.action)}</span></div>
   <div class="actions"><button class="btn ghost sm" data-c="${esc(c.customer_id)}">${icon('sparkle')}Draft the message</button></div><div class="dr" aria-live="polite"></div></article>`).join('')}`;
  $('#rt').onclick=e=>busy(e.currentTarget,async()=>{await api('/model/retrain',{});toast('Model retrained on current data');await V.radar(el)});
  $$('[data-c]',el).forEach(b=>b.onclick=()=>busy(b,async()=>{const d=await api(`/radar/${encodeURIComponent(b.dataset.c)}/draft`,{});b.closest('.tk').querySelector('.dr').innerHTML=`<div class="pop"><div class="res">${esc(d.message)}</div><div class="meta-row">${src(d)}${copyBtn(d.message,'Copy message')}<span class="sub">uses only verified facts</span></div></div>`}))
};

/* ================================================================ scorecard */
V.scorecard=async el=>{
  const [s,l]=await Promise.all([api('/scorecard'),api('/ledger?limit=10')]);if(!el.isConnected)return;
  const S=stagger(),blocks=l.entries.slice().reverse();
  const kindLabel=k=>({promise_kept:'promise kept',promise_broken:'promise broken',credit_issued:'credit issued',credit_capped:'credit capped',config_changed:'rules changed'})[k]||k;
  el.innerHTML=head(S,'Proof','Public scorecard','The page a customer could see next to the price. It is computed only from the ledger, so the business cannot edit its own record without breaking the chain.')+`
  <div class="grid g2">
   <div class="card" ${S()}><div class="lab">Last ${s.window_days} days · ${s.judged.toLocaleString()} promises judged</div>
    <div class="gauge mt"><svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="50"/><circle class="val" cx="60" cy="60" r="50" pathLength="100" style="--v:${(s.overall_kept_rate||0)*100}"/></svg>
     <div><div class="k">${cnt(s.overall_kept_rate,'pct1',pc(s.overall_kept_rate,1))}</div><div class="sub">of promises kept</div><p class="mt-s">Credits paid automatically: <b>${R(s.credits_paid)}</b></p></div></div>
    <div class="mt">${s.promises.map(p=>hbar(`${esc(p.promise)} <span class="sub">${p.kept.toLocaleString()} of ${p.total.toLocaleString()}</span>`,p.kept_rate,rateCls(p.kept_rate),pc(p.kept_rate,1))).join('')}</div></div>
   <div class="card" ${S()}><div class="card-h"><h3>${icon('link')}Tamper-evident ledger</h3><span id="vstate">${l.verify.ok?`<span class="pill">${icon('check')}verified</span>`:`<span class="pill bad">${icon('alert')}broken at #${l.verify.broken_at}</span>`}</span></div>
    <p class="sub">Every row's hash covers the one before it. Change or delete any past row and every hash after it stops matching.</p>
    <div class="chain mt-s" id="chain">${blocks.map(e=>`<div class="blk ${l.verify.ok?'ok':''}"><b>#${e.seq}${icon('check')}</b><div class="kd">${esc(kindLabel(e.kind))}</div><div class="h">${esc(e.hash.slice(0,10))}…</div></div>`).join('')}</div>
    <label>Ledger head: publish it outside the business so anyone can check it</label>
    <div class="row" style="align-items:center"><div class="mono res" style="margin:0">${esc(s.ledger.head)}</div></div>
    <div class="actions">${copyBtn(s.ledger.head,'Copy head hash')}<button class="btn ghost sm" id="vf">${icon('shield')}Verify the whole chain</button></div></div>
  </div>
  <div class="card mt" ${S()}><div class="card-h"><h3>Latest ledger entries</h3><span class="sub">${l.verify.count.toLocaleString()} entries in total</span></div>
   <div class="tw"><table><thead><tr><th>#</th><th>Time</th><th>Event</th><th>Ref</th><th>Hash</th></tr></thead><tbody>${l.entries.map(e=>`<tr><td>${e.seq}</td><td>${esc(e.ts.replace('T',' '))}</td><td><span class="pill ${e.kind==='promise_broken'?'bad':e.kind.startsWith('credit')?'warn':e.kind==='promise_kept'?'':'mute'}">${esc(kindLabel(e.kind))}</span></td><td>${esc(e.ref)}</td><td class="mono">${e.hash.slice(0,16)}…</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#vf').onclick=e=>busy(e.currentTarget,async()=>{
    const bl=$$('.blk',el);bl.forEach(b=>b.classList.remove('ok'));
    const [v]=await Promise.all([api('/ledger/verify'),new Promise(r=>setTimeout(r,motionOK()?150:0))]);
    if(motionOK())for(const b of bl){b.classList.add('ok');await new Promise(r=>setTimeout(r,70))}
    else bl.forEach(b=>b.classList.toggle('ok',v.ok));
    if(!v.ok)bl.forEach(b=>b.classList.remove('ok'));
    $('#vstate').innerHTML=v.ok?`<span class="pill">${icon('check')}verified</span>`:`<span class="pill bad">${icon('alert')}broken at #${v.broken_at}</span>`;
    toast(v.ok?`Verified all ${v.count.toLocaleString()} entries: none altered`:`Chain BROKEN at entry ${v.broken_at}`,v.ok?'ok':'err')})
};

/* ================================================================ customer */
V.customer=async el=>{
  const S=stagger();let start='C1001';try{start=sessionStorage.getItem('kept_cust')||start;sessionStorage.removeItem('kept_cust')}catch(e){}
  el.innerHTML=head(S,'Customer','Customer view','What a customer sees: their service tier, what they have earned, their credits and a one-tap reorder.')+`
  <form class="card" id="cf" ${S()}><div class="row"><div><label for="cs">Search by id or name</label><input id="cs" list="csl" value="${esc(start)}" autocomplete="off"><datalist id="csl"></datalist></div><button class="btn" id="cg">${icon('search')}Open</button></div></form><div id="cd"></div>`;
  const inp=$('#cs');let tmr;
  inp.oninput=()=>{clearTimeout(tmr);tmr=setTimeout(async()=>{const q=inp.value.split(' — ')[0].trim();if(!q)return;try{const l=await api('/customers?q='+encodeURIComponent(q));$('#csl').innerHTML=l.customers.map(c=>`<option value="${esc(c.id)} — ${esc(c.name)}"></option>`).join('')}catch(e){}},180)};
  const open=async(first)=>{
    const q=inp.value.split(' — ')[0].trim();if(!q)throw new Error('type an id or a name');
    const l=await api('/customers?q='+encodeURIComponent(q));
    const hit=l.customers.find(c=>c.id.toLowerCase()===q.toLowerCase())||l.customers[0];if(!hit)throw new Error('no customer matches "'+q+'"');
    const d=await api('/customers/'+encodeURIComponent(hit.id)),c=d.customer;if(!el.isConnected)return;
    const need=d.next_tier?(d.next_tier.name==='Regular'?3:6):6,frac=Math.min(1,d.orders_12m/need);
    const cd=$('#cd');
    cd.innerHTML=`<div class="grid g2 mt"><div class="card" ${S()}><div class="who"><span class="av lg">${ini(c.name)}</span><div><h2 style="font-size:22px">${esc(c.name)}</h2><span class="sub">${esc(c.id)} · ${esc(c.region)}</span></div></div>
      <div class="tags mt"><span class="pill">${d.tier}</span><span class="pill ${c.grp==='holdout'?'warn':'mute'}">${c.grp==='holdout'?'holdout (not covered by Kept)':icon('shield')+'covered by Kept'}</span></div>
      <div class="prog"><span>${d.orders_12m} orders in 12 months</span><span>${d.next_tier?`${d.next_tier.orders_needed} more to <b>${d.next_tier.name}</b>`:'Top service tier'}</span></div>
      <div class="bar"><i style="--w:${frac}"></i></div>
      <p class="sub mt-s">${d.next_tier?`${d.next_tier.name} means faster replies and a named contact.`:'Fastest replies and a named contact.'}</p>
      <div class="actions">${d.reorder_from?`<button class="btn" disabled title="demo only">${icon('refresh')}Reorder ${esc(d.reorder_from.id)} (${R(d.reorder_from.quoted_total)})</button>`:''}</div></div>
     <div class="card" ${S()}><div class="card-h"><h3>${icon('coin')}Credits</h3><span class="pill">${R(d.credits_total_90d)} in 90 days</span></div>
      ${d.credits.length?`<div class="tw"><table><tbody>${d.credits.map(x=>`<tr><td>${esc(x.ts.slice(0,10))}</td><td>${esc(x.promise)} promise broken</td><td style="text-align:right"><b>${R(x.amount)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('check')}<div>None. Every promise was kept.</div></div>`}</div></div>
     <div class="card mt" ${S()}><div class="card-h"><h3>${icon('truck')}Orders</h3><span class="sub">latest ${d.orders.length}</span></div><div class="tw"><table><thead><tr><th>Order</th><th>Placed</th><th>Promised by</th><th>Status</th><th style="text-align:right">Total</th></tr></thead><tbody>${d.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${o.placed_at.slice(0,10)}</td><td>${o.promised_at.slice(0,10)}</td><td>${o.delivered_at?(o.delivered_at>o.promised_at?`<span class="pill bad">late · ${o.delivered_at.slice(0,10)}</span>`:`<span class="pill">${icon('check')}on time</span>`):(o.promised_at<new Date().toISOString().slice(0,19)?'<span class="pill bad">overdue</span>':'<span class="pill warn">in transit</span>')}</td><td style="text-align:right">${R(o.final_total??o.quoted_total)}</td></tr>`).join('')}</tbody></table></div></div>`;
    if(!first)cd.classList.add('fade')
  };
  $('#cf').onsubmit=e=>{e.preventDefault();busy($('#cg'),()=>open(false))};
  try{await open(true)}catch(e){}
};

/* ================================================================ data & AI */
V.data=async el=>{
  const [h,log]=await Promise.all([api('/health'),api('/ai/log')]);if(!el.isConnected)return;
  const S=stagger();
  const sampleO='order_id,customer_id,customer_name,region,placed_at,promised_at,quoted_total,final_total,delivered_at\nA1,Z1,Zodwa M,Gauteng,2026-09-01,2026-09-04,650,650,2026-09-03\nA2,Z2,Pieter K,Limpopo,2026-09-02,2026-09-05,1200,1320,2026-09-09';
  const box=(id,title,hint,ta,file,go)=>`<div class="card" ${S()}><div class="card-h"><h3>${icon('upload')}${title}</h3></div><p class="sub">${hint}</p>
    <div class="drop" data-drop="${ta}"><textarea id="${ta}" rows="6" aria-label="${title} CSV" spellcheck="false" class="mono">${esc(id)}</textarea></div>
    <div class="actions" style="align-items:center"><label class="btn ghost sm" style="margin:0">${icon('upload')}Choose file<input type="file" id="${file}" accept=".csv,text/csv" hidden></label><span class="sub">or drop a CSV on the box</span><button class="btn" id="${go}" style="margin-left:auto">Import</button></div><div id="r_${go}" aria-live="polite"></div></div>`;
  el.innerHTML=head(S,'Set up','Data &amp; AI','Bring your own orders and tickets as CSV, and see exactly what the AI did.')+`
  <div class="grid g2">
   ${box(sampleO,'Import orders','Required: order_id, customer_id, placed_at, promised_at, quoted_total. Optional: customer_name, region, final_total, discount, delivered_at. Historic orders are judged and credits recorded.','io','fo','go1')}
   ${box('customer_id,created_at,text,first_reply_at\nZ2,2026-09-10,Hidden fee on my order and nobody answered,2026-09-12','Import tickets','Required: customer_id, created_at, text. Optional: order_id, first_reply_at, resolved_at. Import orders first.','it','ft','go2')}
  </div>
  <div class="card mt" ${S()}><div class="card-h"><h3>${icon('sparkle')}AI status</h3><span class="pill ${h.ai.configured?'':'mute'}">${esc(h.ai.mode)}</span></div>
   <p class="sub">Choose a model before starting the server: Claude (ANTHROPIC_API_KEY), a free local model with Ollama (KEPT_LLM=ollama), or any OpenAI-compatible API. The same safety checks apply to all of them. With none configured, every feature still works with rule-based answers.</p>
   <div class="tw mt-s"><table><thead><tr><th>When</th><th>Feature</th><th>Source</th><th>Note</th></tr></thead><tbody>${log.log.map(x=>`<tr><td>${esc(x.ts.replace('T',' '))}</td><td>${esc(x.feature)}</td><td><span class="pill ${x.source==='fallback'?'mute':''}">${esc(x.source)}</span></td><td class="sub">${esc(x.note)}</td></tr>`).join('')||'<tr><td colspan="4" class="sub">No AI calls yet. Try the Service desk or Overview.</td></tr>'}</tbody></table></div></div>`;
  const readInto=(f,ta)=>{if(!f)return;const r=new FileReader();r.onload=()=>{ta.value=r.result;toast(`Loaded ${f.name}`)};r.readAsText(f)};
  [['fo','io'],['ft','it']].forEach(([f,t])=>$('#'+f).onchange=e=>readInto(e.target.files[0],$('#'+t)));
  $$('[data-drop]',el).forEach(z=>{const ta=$('#'+z.dataset.drop);
    z.ondragover=e=>{e.preventDefault();z.classList.add('drag')};z.ondragleave=()=>z.classList.remove('drag');
    z.ondrop=e=>{e.preventDefault();z.classList.remove('drag');readInto(e.dataTransfer.files[0],ta)}});
  const imp=(btn,path,ta)=>btn.onclick=()=>busy(btn,async()=>{const r=await api(path,{csv:ta.value});
    $('#r_'+btn.id).innerHTML=`<div class="note ${r.skipped_count?'':'ok'} mt pop">${icon(r.skipped_count?'alert':'check')}<div><b>Imported ${r.imported}, skipped ${r.skipped_count}.</b>${r.skipped.map(s=>`<br>Row ${s.row}: ${esc(s.error)}`).join('')}</div></div>`;
    toast(`Imported ${r.imported} rows${r.skipped_count?`, skipped ${r.skipped_count}`:''}`,r.imported?'ok':'err')});
  imp($('#go1'),'/import/orders',$('#io'));imp($('#go2'),'/import/tickets',$('#it'))
};

/* ================================================================ shell */
const seen=new Set();let showN=0;
const skeleton=()=>`<div class="top"><div><div class="sk" style="height:14px;width:90px;margin-bottom:12px"></div><div class="sk" style="height:32px;width:min(420px,80vw)"></div></div></div><div class="grid g4">${'<div class="sk" style="height:132px"></div>'.repeat(4)}</div><div class="grid g32 mt"><div class="sk" style="height:280px"></div><div class="sk" style="height:280px"></div></div>`;
async function show(){
  const v=(location.hash||'#overview').slice(1),name=V[v]?v:'overview',n=++showN;
  $$('nav a').forEach(a=>a.dataset.v===name?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  document.title=$(`nav a[data-v="${name}"]`).textContent+' · Kept';
  const main=$('#main'),view=document.createElement('div');main.replaceChildren(view);
  const sk=setTimeout(()=>{if(!view.childElementCount)view.innerHTML=skeleton()},120);
  try{await V[name](view);clearTimeout(sk);if(n!==showN)return;seen.has(name)?view.classList.add('fade'):animateIn(view);seen.add(name)}
  catch(e){clearTimeout(sk);if(n===showN)view.innerHTML=`<div class="note bad">${icon('alert')}<div><b>Something went wrong:</b> ${esc(e.message)}</div></div>`}
  scrollTo(0,0)
}
function markTheme(){const t=document.documentElement.dataset.theme||'system';$$('.theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t))}
function setTheme(t){
  const off=document.createElement('style');off.textContent='*,*::before,*::after{transition:none!important}';document.head.append(off);
  if(t==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  try{t==='system'?localStorage.removeItem('kept_theme'):localStorage.setItem('kept_theme',t)}catch(e){}
  getComputedStyle(document.body).opacity;requestAnimationFrame(()=>requestAnimationFrame(()=>off.remove()));markTheme()
}
$('#logo').innerHTML=icon('check');
$$('nav a').forEach(a=>a.insertAdjacentHTML('afterbegin',icon(a.dataset.i)));
$$('.theme button').forEach(b=>{b.innerHTML=icon({system:'monitor',light:'sun',dark:'moon'}[b.dataset.theme]);b.onclick=()=>setTheme(b.dataset.theme)});markTheme();
document.addEventListener('click',async e=>{
  const c=e.target.closest('[data-copy]');
  if(c){try{await navigator.clipboard.writeText(c.dataset.copy);const lab=c.lastElementChild,was=lab.textContent;c.classList.add('on');lab.textContent='Copied';setTimeout(()=>{c.classList.remove('on');lab.textContent=was},1600)}catch(_){toast('Copy is blocked in this browser','err')}}
  const x=e.target.closest('[data-dismiss]');
  if(x){synthHidden=true;try{localStorage.setItem('kept_synth','hide')}catch(_){}x.closest('.note').remove()}
});
addEventListener('hashchange',show);show();
api('/health').then(h=>$('#aistat').innerHTML=`<span class="dot ${h.ai.configured?'on':''}"></span><span>${h.ai.configured?'AI: '+esc(h.ai.mode):'AI: rule-based fallback<br><span style="opacity:.7">no model configured</span>'}</span>`).catch(()=>{});
</script>
</body>
